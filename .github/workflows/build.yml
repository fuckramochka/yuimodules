name: Build hmod

on:
  push:
    branches: [main]
    paths: ['modules/**', 'hot-api/**', '.github/workflows/build.yml']
  workflow_dispatch:
    inputs:
      modules:
        description: 'Module ids (comma separated, empty = all)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - name: Checkout yuimodules
        uses: actions/checkout@v4
      - name: Checkout amenew for API classpath
        uses: actions/checkout@v4
        with:
          repository: fuckramochka/amegram
          path: amenew
          fetch-depth: 1
      - name: Set up JDK
        uses: actions/setup-java@v4
        with: { distribution: jetbrains, java-version: '21' }
      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Point Chaquopy at that Python
        run: echo "CHAQUOPY_BUILD_PYTHON=$(which python3.11 || which python)" >> $GITHUB_ENV
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with: { packages: "platforms;android-36 build-tools;36.0.0" }
      - name: Compile amenew classes for classpath (dummy API keys, compile only)
        working-directory: amenew
        env:
          TELEGRAM_APP_ID: '1'
          TELEGRAM_APP_HASH: 'dummyhashfordummybuild0000000000000000'
        run: |
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
          ./gradlew :TMessagesProj:compileReleaseJavaWithJavac --parallel --build-cache --max-workers=4
      - name: Build .hmod files
        run: |
          ANDROID_JAR="$ANDROID_HOME/platforms/android-36/android.jar"
          D8=$(ls -d "$ANDROID_HOME/build-tools/"*/d8 | sort | tail -1)
          APP_CLASSES=$(find amenew/TMessagesProj/build -type d \( -name classes -o -name kotlin-classes \) 2>/dev/null | tr '\n' ':')
          test -n "$APP_CLASSES" || { echo "no compiled classes dir"; exit 1; }
          echo "APP_CLASSES=$APP_CLASSES"
          RJAR=$(find amenew/TMessagesProj/build -name "R.jar" 2>/dev/null | head -1)
          MODCP="hot-api:$ANDROID_JAR:$APP_CLASSES"
          if [ -n "$RJAR" ]; then MODCP="$MODCP:$RJAR"; fi
          DEPCP=$(find ~/.gradle/caches/9.7.1/transforms ~/.gradle/caches/transforms-4 ~/.gradle/caches/modules-2 -name "*.jar" 2>/dev/null | grep -v -- "-sources" | grep -v -- "-javadoc" | tr '\n' ':')
          MODCP="$MODCP:$DEPCP"
          mkdir -p out-hmod
          FILTER="${{ inputs.modules }}"
          if [ -z "$FILTER" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
            FILTER=$(python3 - <<'PY'
          import glob, json
          catalog = json.load(open("modules.json", encoding="utf-8"))
          entries = {item["id"]: item for item in catalog.get("modules", [])}
          pending = []
          for path in glob.glob("modules/*/manifest.json"):
              manifest = json.load(open(path, encoding="utf-8"))
              stable = entries.get(manifest["id"], {}).get("branches", {}).get("stable", {})
              if manifest.get("version") != stable.get("version"):
                  pending.append(manifest["id"])
          print(",".join(sorted(pending)))
          PY
          )
          fi
          for moddir in modules/*/; do
            mod=$(basename "$moddir")
            if [ -n "$FILTER" ]; then
              case ",$FILTER," in *",$mod,"*) ;; *) echo "skip $mod"; continue;; esac
            fi
            [ -f "$moddir/manifest.json" ] || continue
            ver=$(python3 -c "import json;print(json.load(open('$moddir/manifest.json'))['version'])")
            OUT=out-hmod/classes-$mod
            rm -rf "$OUT" && mkdir -p "$OUT"
            javac -source 8 -target 8 -nowarn -proc:none -cp "$MODCP" -d "$OUT" "$moddir"*.java || { echo "javac failed for $mod"; exit 1; }
            DEXOUT=out-hmod/dex-$mod
            rm -rf "$DEXOUT" && mkdir -p "$DEXOUT"
            (cd "$OUT" && zip -q -r "../classes-$mod.jar" . -i "*.class") || { echo "zip failed for $mod"; exit 1; }
            D8LIB=$(echo "$APP_CLASSES" | tr ':' '\n' | head -1)
            "$D8" --min-api 27 --lib "$ANDROID_JAR" --lib "$D8LIB" --output "$DEXOUT" "out-hmod/classes-$mod.jar" || { echo "d8 failed for $mod"; exit 1; }
            python3 - "$moddir/manifest.json" "$DEXOUT/classes.dex" "out-hmod/$mod-$ver.hmod" <<'PY'
          import json, sys, zipfile
          manifest_src, dex_src, dest = sys.argv[1], sys.argv[2], sys.argv[3]
          m = json.load(open(manifest_src))
          with zipfile.ZipFile(dest, "w", zipfile.ZIP_DEFLATED) as z:
              z.write(dex_src, "classes.dex")
              z.write(manifest_src, "manifest.json")
          print("packed", dest)
          PY
          done
          ls -la out-hmod/*.hmod
      - name: Publish hmods + catalog
        run: |
          python3 - <<'PY'
          import hashlib, json, os, shutil, glob
          hdir = "hmods"
          os.makedirs(hdir, exist_ok=True)
          cat = json.load(open("modules.json", encoding="utf-8"))
          by_id = {m["id"]: m for m in cat.get("modules", [])}
          for hmod in glob.glob("out-hmod/*.hmod"):
              base = os.path.basename(hmod)
              mod_id = base.rsplit("-", 1)[0]
              with open(hmod, "rb") as f:
                  raw = f.read()
                  sha = hashlib.sha256(raw).hexdigest()
              size = len(raw)
              shutil.copy(hmod, os.path.join(hdir, base))
              mfest = json.load(open(f"modules/{mod_id}/manifest.json", encoding="utf-8"))
              ver = mfest["version"]
              e = by_id.get(mod_id)
              if e is None:
                  continue
              # Вітрина магазину: тягнемо з маніфеста модуля, щоб переживало перезбірки.
              e["author"] = mfest.get("author", e.get("author", "AmeGram Team"))
              e["category"] = mfest.get("category", e.get("category", "other"))
              e["featured"] = bool(mfest.get("featured", e.get("featured", False)))
              perms = mfest.get("permissions", None)
              st = e["branches"].get("stable", {})
              oldv = st.get("version", "")
              url = f"https://raw.githubusercontent.com/fuckramochka/yuimodules/main/hmods/{base}"
              if oldv and oldv != ver:
                  e.setdefault("history", []).insert(0, {
                      "branch": "stable", "version": oldv, "url": st.get("url", ""),
                      "sha256": st.get("sha256", ""), "sizeBytes": st.get("sizeBytes", 0),
                      "minApp": st.get("minApp", 0),
                      "changelog": st.get("changelog", ""),
                      "permissions": st.get("permissions", [])})
              st.update({"version": ver, "url": url, "sha256": sha, "sizeBytes": size,
                         "minApp": mfest.get("minApp", st.get("minApp", 0)),
                         "changelog": mfest.get("changelog", st.get("changelog", ""))})
              if perms is not None:
                  st["permissions"] = perms
              print(mod_id, ver, sha[:12])
          json.dump(cat, open("modules.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          print("catalog updated")
          PY
          git config user.email "fuckramochka@users.noreply.github.com" && git config user.name "fuckramochka" && git add .gitignore modules.json hmods modules hot-api && git diff --cached --stat | head -20 && git commit -m "hmod build" -q && git push origin main
